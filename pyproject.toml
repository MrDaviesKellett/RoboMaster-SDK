[build-system]
requires = ["setuptools>=82", "wheel>=0.45", "cmake>=3.15", "pybind11>=3.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "robomaster-sdk-modern"
description = "Community-maintained DJI RoboMaster Python SDK fork with Python 3.14+ support"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "Apache License 2.0"}
authors = [
  {name = "RoboMaster SDK Community Fork"}
]
keywords = ["dji", "robomaster", "sdk", "robot", "drone"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = [
  "numpy>=2.3.4",
  "opencv-python>=4.13.0.92",
  "psutil>=7.2.2",
]
dynamic = ["version"]

[project.optional-dependencies]
qrcode = ["MyQR>=2.3.1"]
release = [
  "build>=1.2.2.post1",
  "cibuildwheel>=3.3.0",
  "delocate>=0.13.0",
  "delvewheel>=1.11.2",
  "twine>=6.1.0",
]

[project.urls]
Homepage = "https://robomaster-dev.rtfd.io/"
Documentation = "https://robomaster-dev.rtfd.io/"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robomaster = ["LICENSE.txt", "README.md"]

[tool.setuptools.dynamic]
version = {attr = "robomaster.version.__version__"}

[tool.robomaster_release]
distribution = "robomaster-sdk-modern"
build = "python -m build --sdist && python -m cibuildwheel --output-dir dist"
upload = "python -m twine upload dist/*"
test_upload = "python -m twine upload --repository testpypi dist/*"

[tool.cibuildwheel]
archs = "auto64"
build = "cp314-*"
skip = "*-musllinux_*"
test-command = "python -c \"import libmedia_codec; import robomaster.media; print(libmedia_codec.__name__)\""

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
before-all = "dnf install -y pkgconf-pkg-config libavcodec-free-devel libavutil-free-devel libswscale-free-devel opus-devel"

[tool.cibuildwheel.macos]
before-all = "brew install pkg-config ffmpeg opus"
before-build = "python -m pip install --upgrade delocate"
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.windows]
archs = "AMD64"
before-build = "python -m pip install --upgrade delvewheel"
repair-wheel-command = "delvewheel repair --add-path \"lib\\\\libmedia_codec\\\\src\\\\ffmpeg-dll;lib\\\\libmedia_codec\\\\src\\\\opus-dll\" -w {dest_dir} {wheel}"
